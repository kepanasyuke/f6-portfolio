line-length = 110
target-version = "py312"
indent-width = 4
src = ["."]

[lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "B",
  "RET",
  "C4",
  "RUF",
]
ignore = [
  "N802",
  "N803",
  "N806",
  "RUF001",
  "RUF002",
  "RUF003",
]

[lint.per-file-ignores]
"**/tests/*" = ["E501"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "cr-lf"
